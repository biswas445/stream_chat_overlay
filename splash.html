<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; script-src 'none'"
    /><!-- Same policy shape as chat.html; this page runs no scripts — the
      main process drives its dismissal (executeJavaScript bypasses page
      CSP, like the widget theming does). -->
    <title>Hikasha Chat</title>
    <style>
      :root {
        --claude-surface: rgba(242, 239, 231, 0.92);
        --claude-ink: #3d3929;
        --claude-ink-soft: rgba(61, 57, 41, 0.62);
        --claude-accent: #d97757;
        --claude-accent-deep: #c15f3c;
        --claude-border: rgba(61, 57, 41, 0.14);
        --shadow-float: 0 14px 34px rgba(50, 44, 30, 0.18), 0 3px 8px rgba(50, 44, 30, 0.1);
        --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: transparent;
        font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
        user-select: none;
      }

      /* The floating splash card — the exact card language of the chat
         panel: same radius, surface, border and shadow. */
      #splash-card {
        position: absolute; inset: 10px;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        border-radius: 18px;
        background: var(--claude-surface);
        border: 1px solid var(--claude-border);
        box-shadow: var(--shadow-float);
        animation: card-in 0.3s var(--ease-out);
        transition: opacity 0.35s var(--ease-out), transform 0.35s var(--ease-out);
      }
      @keyframes card-in {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
      }

      /* The logo: a breathing terracotta halo behind it and a rotating
         accent ring around it — the "loading" effect, in theme colors. */
      #logo-wrap {
        position: relative;
        width: 132px; height: 132px;
        display: flex; align-items: center; justify-content: center;
      }
      #logo-halo {
        position: absolute; inset: -22px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(217, 119, 87, 0.30) 0%, rgba(217, 119, 87, 0.10) 45%, transparent 70%);
        animation: halo-breathe 2.2s ease-in-out infinite alternate;
      }
      @keyframes halo-breathe {
        from { transform: scale(0.85); opacity: 0.55; }
        to { transform: scale(1.15); opacity: 1; }
      }
      #logo-ring {
        position: absolute; inset: -7px;
        border-radius: 50%;
        border: 2.5px solid rgba(61, 57, 41, 0.10);
        border-top-color: var(--claude-accent);
        animation: ring-spin 1.1s linear infinite;
      }
      @keyframes ring-spin {
        to { transform: rotate(360deg); }
      }
      #logo-img {
        width: 108px; height: 108px;
        display: block;
        animation: logo-pop 0.55s var(--spring) 0.1s backwards;
        filter: drop-shadow(0 3px 10px rgba(50, 44, 30, 0.25));
      }
      @keyframes logo-pop {
        from { opacity: 0; transform: scale(0.5) rotate(-8deg); }
        to { opacity: 1; transform: scale(1) rotate(0deg); }
      }

      /* The title: same style as the panel header title — heart in the
         accent color, ink text, spring fade-up. */
      #splash-title {
        display: flex; align-items: center; gap: 7px;
        color: var(--claude-ink);
        font-size: 15px; font-weight: 600;
        white-space: nowrap;
        animation: title-rise 0.5s var(--ease-out) 0.35s backwards;
      }
      #splash-title .heart { color: var(--claude-accent); font-size: 13px; animation: heart-beat 1.6s ease-in-out infinite; }
      @keyframes title-rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes heart-beat {
        0%, 100% { transform: scale(1); }
        12% { transform: scale(1.28); }
        24% { transform: scale(1); }
        36% { transform: scale(1.18); }
        48% { transform: scale(1); }
      }

      /* Loading dots: three accent pulses, staggered. */
      #splash-dots {
        display: flex; gap: 7px;
        animation: title-rise 0.5s var(--ease-out) 0.5s backwards;
      }
      #splash-dots .d {
        width: 6px; height: 6px;
        border-radius: 50%;
        background: var(--claude-accent);
        animation: dot-bounce 1.2s ease-in-out infinite;
      }
      #splash-dots .d:nth-child(2) { animation-delay: 0.15s; }
      #splash-dots .d:nth-child(3) { animation-delay: 0.3s; }
      @keyframes dot-bounce {
        0%, 100% { transform: translateY(0); opacity: 0.45; }
        50% { transform: translateY(-6px); opacity: 1; }
      }

      /* Dismissal: main process adds .bye to <body> — the card folds away
         with the same ease-out as it arrived. */
      body.bye #splash-card { opacity: 0; transform: scale(0.94); pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="splash-card">
      <div id="logo-wrap">
        <div id="logo-halo"></div>
        <div id="logo-ring"></div>
        <img id="logo-img" src="./chat-logo.png" alt="Hikasha Chat" />
      </div>
      <div id="splash-title"><span class="heart">&#9829;</span> Hikasha Chat</div>
      <div id="splash-dots"><span class="d"></span><span class="d"></span><span class="d"></span></div>
    </div>
  </body>
</html>
