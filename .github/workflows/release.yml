name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # build only — the gh step below owns publishing (no GH_TOKEN here,
      # so electron-builder cannot double-publish)
      - run: npm run build
      - run: npx electron-builder --win --publish never
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "Hikasha Chat v${VERSION}" \
            --generate-notes \
            "release/Hikasha Chat Setup ${VERSION}.exe" \
            "release/Hikasha Chat Setup ${VERSION}.exe.blockmap" \
            "release/latest.yml"
